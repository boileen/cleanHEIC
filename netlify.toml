[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires Node 20.19+ or 22.12+.
  NODE_VERSION = "22"

# Client-side routes fall back to index.html. Netlify serves real files first
# (file shadowing), so the pre-rendered /heic-to-* directories, hashed assets,
# icons and decoder worker are delivered directly without being rewritten.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
